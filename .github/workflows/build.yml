name: Build release bundle
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build bundle
        run: gradle bundleRelease --no-daemon
      - name: Sign bundle (only if keystore secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > upload.jks
            jarsigner -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" "$AAB" "$KEY_ALIAS"
            rm upload.jks
          else
            echo "No keystore secrets set; leaving bundle unsigned."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TipCal-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
